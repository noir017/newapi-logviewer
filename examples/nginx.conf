# Serving New API and the log viewer on one domain.
#
# Two things this file gets right that a default proxy config does not:
#
#   1. Streaming. New API is an LLM gateway; without proxy_buffering off the
#      proxy holds tokens in a buffer and the client sees nothing until the
#      response completes. gzip must be off for the same reason.
#   2. Timeouts. proxy_send_timeout defaults to 60s, which severs long
#      reasoning-model generations mid-stream.

# Put this in the http{} block (nginx.conf), not in the server block:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name newapi.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # LLM request bodies get large (multimodal images, long context).
    client_max_body_size 0;
    client_body_timeout  300s;

    # Never gzip an SSE stream: tokens pile up in the compression buffer.
    gzip off;

    # ---- log viewer ----
    location /logviewer/ {
        # AUTH_MODE=none is the practical setting (see README), so authenticate
        # here instead. Remove these two lines if you handle auth elsewhere.
        auth_basic           "log viewer";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:7071/logviewer/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # ---- New API ----
    location / {
        proxy_pass     http://127.0.0.1:3000;
        proxy_redirect off;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket / SSE. Uses the map above so non-upgrade requests send
        # "close" instead of a hardcoded "upgrade".
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming: without these, responses arrive as one blob at the end.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;

        proxy_connect_timeout 75s;
        proxy_send_timeout  3600s;   # default 60s cuts off long generations
        proxy_read_timeout  3600s;
    }
}
