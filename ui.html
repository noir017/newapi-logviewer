<!-- Vendored chart library, served from /assets by the binary itself (see the
     go:embed in main.go) — never a CDN: the image is scratch on an air-gapped
     LAN, so an external <script> would simply fail to load. -->
<script src="assets/chart.umd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page = 1, state = {}, selected = null, timer = null, detailCache = null;

function hl(obj){
  const j = JSON.stringify(obj, null, 2);
  return esc(j)
    .replace(/&quot;([^&]+?)&quot;(\s*:)/g, '<span class="tk">&quot;$1&quot;</span>$2')
    .replace(/:\s*&quot;([^]*?)&quot;/g, ': <span class="tv">&quot;$1&quot;</span>')
    .replace(/:\s*(-?\d+\.?\d*)/g, ': <span class="tn">$1</span>')
    .replace(/:\s*(true|false)/g, ': <span class="tb">$1</span>')
    .replace(/:\s*(null)/g, ': <span class="tnull">$1</span>');
}
const fmtQ = q => q == null ? '—' : '$' + (q / 500000).toFixed(6);
function contentText(c){
  // null/undefined content is normal on a tool-call-only assistant turn.
  // JSON.stringify would turn it into the literal text `""`, which renders as
  // junk and counts as 2 characters.
  if (c == null) return '';
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.map(p =>
    p?.type === 'text' ? p.text :
    p?.type === 'image_url' ? '[image] ' + (p.image_url?.url || '').slice(0, 90) :
    JSON.stringify(p)).join('\n');
  return JSON.stringify(c);
}
function safeArgs(a){ try { return JSON.parse(a); } catch { return a; } }
const toEpoch = v => v ? Math.floor(new Date(v).getTime() / 1000) : '';
function localISO(d){
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ---- collapsing -----------------------------------------------------------
// Summary shown on a collapsed block. Character count is what you actually
// want when judging a prompt; line count only when it is multi-line.
function statOf(s){
  s = String(s ?? '');
  const chars = [...s].length;                 // codepoints, so CJK counts as 1
  const lines = s ? s.split('\n').length : 0;
  const out = [chars.toLocaleString() + ' 字符'];
  if (lines > 1) out.push(lines.toLocaleString() + ' 行');
  return out.join(' · ');
}
const statJSON = o => statOf(JSON.stringify(o, null, 2));

// Wrap content in a clamp. `fade` must match the block's own background or the
// gradient shows as a grey band.
let clampSeq = 0;
function clamp(inner, stat, opts){
  const o = opts || {};
  const id = 'c' + (++clampSeq);
  const h = o.h || 84;
  const fade = o.fade || '#12151b';
  return `<div class="clampwrap" data-stat="${esc(stat)}">
    <div class="clamp on" id="${id}" style="--clh:${h}px;--fadeto:${fade}">${inner}</div>
    <div class="exp" data-for="${id}" hidden>
      <span class="ar">▶</span><span class="lbl">展开</span>
      <span class="meta">${esc(stat)}</span>
    </div></div>`;
}

function toolsHtml(tools, called){
  return tools.map(t => {
    const f = t.function || t, p = f.parameters || {},
          props = p.properties || {}, req = p.required || [];
    const used = (called || []).includes(f.name);
    const entries = Object.entries(props);
    const rows = entries.map(([k, v]) =>
      `<div class="p"><span class="pn">${esc(k)}</span>
       <span class="pt">${esc(v.type || '')}</span>
       ${req.includes(k) ? '<span class="rq">必填</span>' : ''}
       ${v.description ? ' — ' + esc(v.description) : ''}</div>`).join('');
    const body = `${f.description ? `<div class="ds">${esc(f.description)}</div>` : ''}
      <div class="params">${rows || '<i>无参数</i>'}</div>`;
    const stat = `${entries.length} 参数${req.length ? ` · ${req.length} 必填` : ''}`;
    return `<div class="tool-def ${used ? 'used' : ''}">
      <div class="nm">⚒ ${esc(f.name)}${used ? '<span class="used-badge">本次调用</span>' : ''}</div>
      ${clamp(body, stat, {h: 66, fade: used ? '#171308' : '#12151b'})}</div>`;
  }).join('');
}

// ---- cards ----------------------------------------------------------------
// A collapsible top-level container. `open` decides the initial state: the
// tool catalogue and the long middle of a transcript start closed, because on
// a 130-message agent call they are what makes the page unreadable.
let cardSeq = 0;
function card(title, summary, body, opts){
  const o = opts || {};
  const id = 'k' + (++cardSeq);
  return `<div class="card ${o.cls || ''} ${o.open ? 'open' : ''}" id="${id}">
    <div class="chd" data-card="${id}">
      <span class="ar">▶</span>
      <span class="ct">${title}</span>
      <span class="cs">${summary}</span>
      ${o.right || ''}
    </div>
    <div class="cbd">${body}</div>
  </div>`;
}

// Group a flat message list into turns: an assistant message plus the tool
// results it triggered. system/user messages stand alone as their own cards.
function groupTurns(msgs){
  const out = [];
  let cur = null;
  for (const m of msgs){
    if (m.role === 'assistant'){
      cur = {kind: 'turn', assistant: m, results: []};
      out.push(cur);
    } else if (m.role === 'tool' && cur){
      cur.results.push(m);
    } else {
      cur = null;
      out.push({kind: 'msg', msg: m});
    }
  }
  return out;
}

// One block inside a turn: the assistant's text, a tool call's arguments, or a
// tool result. `sole` drops the clamp when the block is the card's ONLY content
// — a card header and a clamp are both collapse controls, so stacking them
// costs two clicks to read one message. With several blocks the clamp earns its
// place: it keeps a long tool result from burying the ones under it.
function turnBlock(b, sole){
  const head = b.role ? `<div class="role">${b.role}</div>`
                      : `<div class="nm">⚒ ${esc(b.name)}</div>`;
  return `<div class="${b.cls}">${head}
    ${sole ? b.inner : clamp(b.inner, b.stat, {h: 76, fade: b.fade})}</div>`;
}

function turnCard(t, n){
  const a = t.assistant;
  const calls = a.tool_calls || [];
  const txt = contentText(a.content);
  const names = {};
  calls.forEach(c => { const k = c.function?.name || '?'; names[k] = (names[k] || 0) + 1; });
  const chips = Object.entries(names).map(([k, v]) =>
    `<span class="tag tl">⚒${esc(k)}${v > 1 ? ' ×' + v : ''}</span>`).join('');
  const resChars = t.results.reduce((s, r) => s + [...contentText(r.content)].length, 0);
  const summary = `<span class="tt">${chips}</span>`;
  const right = `<span class="cs" style="flex:none;text-align:right">${
    (txt ? statOf(txt) + ' · ' : '')}${t.results.length} 结果 · ${resChars.toLocaleString()} 字符</span>`;

  const blocks = [];
  if (txt) blocks.push({cls: 'msg assistant', role: 'assistant',
    inner: `<div class="txt">${esc(txt)}</div>`, stat: statOf(txt)});
  for (const tc of calls){
    const args = safeArgs(tc.function?.arguments);
    blocks.push({cls: 'tc', name: tc.function?.name,
      inner: `<pre class="j">${hl(args)}</pre>`, stat: statJSON(args), fade: '#1a1710'});
  }
  for (const r of t.results){
    const rt = contentText(r.content);
    blocks.push({cls: 'msg tool', role: 'tool result',
      inner: `<div class="txt">${esc(rt)}</div>`, stat: statOf(rt)});
  }
  const sole = blocks.length === 1;

  return card(`<span class="idx">#${n}</span> 调用`, summary,
              blocks.map(b => turnBlock(b, sole)).join(''), {cls: 'turn', right});
}

function usageHtml(u){
  if (!u) return '';
  const r = u.completion_tokens_details?.reasoning_tokens;
  const cell = (l, v, cls='') => v == null ? '' :
    `<div class="${cls}"><b>${l}</b><span>${v}</span></div>`;
  return `<div class="usage">
    ${cell('输入', u.prompt_tokens)}${cell('输出', u.completion_tokens)}
    ${cell('推理', r, 'hl')}${cell('合计', u.total_tokens)}
    ${cell('缓存', u.prompt_tokens_details?.cached_tokens)}</div>`;
}

function detail(r){
  const req = r.request || {}, resp = r.response || {};
  const msg = resp.choices?.[0]?.message;
  const content = r.is_stream ? r.stream_content : (msg?.content || '');
  const reasoning = r.is_stream ? r.stream_reasoning : (msg?.reasoning_content || '');
  const tcs = (r.is_stream ? r.stream_tool_calls : msg?.tool_calls) || [];
  // `all` adds a section-level 展开全部 / 收起全部 control
  const sec = (title, n, inner, all) => inner ?
    `<section><div class="st"><h3>${title}</h3>${n ? `<span class="n">${n}</span>` : ''}
      <span class="grow"></span>
      ${all ? '<span class="toggle" data-all="1">展开全部</span>' : ''}
     </div>${inner}</section>` : '';
  const slim = {...req}; delete slim.messages; delete slim.tools;

  const msgs = req.messages || [];
  // total prompt size across all messages - the number that tells you whether
  // a request was bloated, without expanding every message to count
  const promptChars = msgs.reduce((n, m) => n + [...contentText(m.content)].length, 0);

  // Group the transcript into cards. system/user messages stand alone; each
  // assistant message and the tool results it produced form one turn card.
  const groups = groupTurns(msgs);
  const turns = groups.filter(g => g.kind === 'turn');
  let turnNo = 0;
  const cardOf = (g, open) => {
    if (g.kind === 'turn') return turnCard(g, ++turnNo);
    const m = g.msg, t = contentText(m.content);
    const cls = m.role === 'system' ? 'sysmsg' : m.role === 'user' ? 'usermsg' : '';
    // No clamp here: the card header IS the collapse control, and a 16k system
    // prompt behind a card toggle AND an inner 展开 took two clicks to read one
    // message. Opening the card is already the deliberate "show me this".
    return card(esc(m.role), statOf(t),
      `<div class="msg ${esc(m.role)}"><div class="txt">${esc(t)}</div></div>`,
      {cls, open: open && [...t].length <= OPEN_CHARS});
  };
  // A 351-message transcript rendered as 351 sibling cards means scrolling past
  // all of it to reach 本次模型返回 — the thing you actually opened the record
  // for. Past FOLD_AT groups, fold the history into one card that reports only
  // its size, like the tool catalogue, and leave the newest exchange (this
  // call's actual prompt) in the open next to the response. Below that a fold
  // buys nothing and costs a click, so render flat.
  const FOLD_AT = 4, OPEN_CHARS = 400;
  const fold = groups.length > FOLD_AT;
  const hist = fold ? groups.slice(0, -1) : [];
  const tailGroups = fold ? groups.slice(-1) : groups;
  const histMsgs = hist.reduce((n, g) =>
    n + (g.kind === 'turn' ? 1 + g.results.length : 1), 0);
  const histChars = hist.reduce((n, g) => n + (g.kind === 'turn'
    ? [...contentText(g.assistant.content)].length
      + g.results.reduce((s, r) => s + [...contentText(r.content)].length, 0)
    : [...contentText(g.msg.content)].length), 0);
  const histTurns = hist.filter(g => g.kind === 'turn').length;
  // Numbering runs over all groups so the folded history and the tail share one
  // sequence; build the history HTML first to keep turnNo in order.
  const histHtml = hist.map(g => cardOf(g, false)).join('');
  const convHtml = (fold ? card('会话历史',
      `${histMsgs} 条消息${histTurns ? ` · ${histTurns} 次调用` : ''} · ${histChars.toLocaleString()} 字符`,
      histHtml,
      {cls: 'hist', open: false,
       right: '<span class="toggle exp-all" data-all="1">展开全部</span>'})
    + '<div class="tailhd">最新一条</div>' : '')
    + tailGroups.map(g => cardOf(g, true)).join('');

  return `
  <div class="dh">
    <h2>${esc(r.model || '—')}</h2>
    ${statusTag(r)}
    ${r.is_stream ? '<span class="tag st">流式</span>' : ''}
    <span class="rid mono">${esc(r.request_id)}</span>
  </div>
  ${r.incomplete ? '<div class="warnbox">⚠ 该请求的请求体不在当前日志文件中（可能已轮转），仅显示可得字段。</div>' : ''}
  ${r.stalled ? '<div class="warnbox">⚠ 该调用没有收到结束记录，可能是客户端断开或网关重启。以下为已捕获的部分内容。</div>' : ''}
  <div class="kv">
    <div><b>时间</b><span>${esc(r.ts || '')}</span></div>
    <div><b>耗时</b><span>${esc(r.latency || '—')}</span></div>
    <div><b>首字延迟</b><span>${r.frt > 0 ? r.frt + ' ms' : '—'}</span></div>
    <div><b>渠道 / 令牌</b><span>${esc(chanLabel(r))} · ${esc(r.token_name || '—')}</span></div>
    <div><b>计费</b><span>${fmtQ(r.quota)}</span></div>
    <div><b>倍率</b><span>${r.model_ratio ?? '—'} × ${r.completion_ratio ?? '—'}</span></div>
    <div><b>客户端 IP</b><span>${esc(r.ip || '—')}</span></div>
    <div><b>流式结束</b><span>${esc(r.stream_end || r.outcome_reason || '—')}</span></div>
    <div style="grid-column:1/-1"><b>上游地址</b><span>${esc(r.upstream_url || '—')}</span></div>
  </div>
  ${sec('用量', '', usageHtml(r.usage))}
  ${(req.tools || []).length ? sec('可用工具', '', card('Tools 定义',
      `${req.tools.length} 个可用${r.called_tools?.length ? ` · 本次调用 ${r.called_tools.length}` : ''}`,
      `<div class="tools-grid">${toolsHtml(req.tools, r.called_tools)}</div>`,
      // closed by default: 20 tool schemas ahead of the conversation is the
      // main thing that buries the actual content
      {open: false, right: '<span class="toggle exp-all" data-all="1">展开全部</span>'})) : ''}
  ${msgs.length ? sec('会话',
      `${msgs.length} 条消息 · ${turns.length} 次调用 · ${promptChars.toLocaleString()} 字符`,
      convHtml, true) : ''}
  ${sec('本次模型返回', content ? statOf(content) : '', content
      ? `<div class="msg assistant"><div class="role">assistant</div>
         ${clamp(`<div class="txt">${esc(content)}</div>`, statOf(content), {h: 84})}</div>`
      : (tcs.length ? '' : '<div class="msg assistant"><div class="role">assistant</div><div class="txt" style="color:var(--dim2)">（无文本内容）</div></div>'))}
  ${sec('本次工具调用', tcs.length + ' 次', tcs.map(tc => {
      const args = safeArgs(tc.function?.arguments);
      return `<div class="tc"><div class="nm">⚒ ${esc(tc.function?.name)}</div>
       ${clamp(`<pre class="j">${hl(args)}</pre>`, statJSON(args), {h: 84, fade: '#1a1710'})}</div>`;
    }).join(''), tcs.length > 0)}
  ${sec('推理过程', reasoning ? statOf(reasoning) : '',
      reasoning ? clamp(`<div class="reason">${esc(reasoning)}</div>`,
                        statOf(reasoning), {h: 84, fade: '#141019'}) : '')}
  ${sec('请求参数', statJSON(slim),
      clamp(`<pre class="j">${hl(slim)}</pre>`, statJSON(slim), {h: 84, fade: '#0d1017'}))}
  ${sec('原始响应 JSON', r.response ? statJSON(r.response) : '',
      r.response ? clamp(`<pre class="j">${hl(r.response)}</pre>`,
                         statJSON(r.response), {h: 84, fade: '#0d1017'}) : '')}
  ${sec('报错', r.errors?.length || '', r.errors?.length
      ? clamp(`<pre class="j">${hl(r.errors)}</pre>`, statJSON(r.errors), {h: 84, fade: '#0d1017'})
      : '')}
  `;
}

// Reveal a toggle only on blocks that actually overflow their clamp. Height
// depends on wrapping, so this has to run against the live DOM after render.
function wireClamps(root){
  root.querySelectorAll('.clamp').forEach(el => {
    const btn = root.querySelector(`.exp[data-for="${el.id}"]`);
    if (!btn) return;
    // A collapsed card's children have no layout: scrollHeight reads 0 and we
    // would delete a toggle the content actually needs. Those are measured
    // when the card is first opened instead.
    const hidden = el.closest('.card:not(.open)');
    if (hidden) return;
    const limit = parseInt(el.style.getPropertyValue('--clh')) || 84;
    if (el.scrollHeight <= limit + 8){
      // fits already - drop the clamp entirely rather than showing a
      // toggle that does nothing
      el.classList.remove('on');
      btn.remove();
    } else {
      btn.hidden = false;
    }
  });
}

function setExpanded(btn, open){
  const el = document.getElementById(btn.dataset.for);
  if (!el) return;
  el.classList.toggle('on', !open);
  btn.classList.toggle('open', open);
  btn.querySelector('.lbl').textContent = open ? '收起' : '展开';
}

function item(r){
  // Tool NAMES are not shown here any more: an agent request defines 20 of
  // them and the chips swamped the row. The count is the useful signal; the
  // detail pane lists the names.
  const nTools = r.tool_count || (r.tool_names || []).length;
  const toolTag = nTools
    ? `<span class="tag tl" data-tools="1" title="含 ${nTools} 个工具定义 · 点击筛选">⚒${nTools}</span>`
    : '';
  // A single call can carry a whole agent transcript, so say how many model
  // round-trips are in it.
  const turnTag = (r.turns || 0) > 1
    ? `<span class="tag st" title="${r.msg_count} 条消息">↻${r.turns} 次调用</span>` : '';
  // New API logs the channel id but never its name, so the name is resolved
  // from its admin API when a token is configured. Falling back to the upstream
  // host keeps the column useful without one.
  const chTag = chanChip(r);
  return `<div class="item ${selected === r.request_id ? 'sel' : ''}" data-id="${esc(r.request_id)}">
    <div class="i1">
      <span class="t">${esc((r.ts || '').slice(5, 16))}</span>
      <span class="m">${esc(r.model || '—')}</span>
      ${statusTag(r)}
    </div>
    <div class="i2">${esc(r.preview || '（无提示词）')}</div>
    <div class="i3">
      ${chTag}
      ${turnTag}
      ${r.is_stream ? '<span class="tag st">流</span>' : ''}
      ${r.errors?.length ? '<span class="tag err">报错</span>' : ''}
      <span class="tag">${fmtQ(r.quota)}</span>
      ${r.latency ? `<span class="tag">${esc(r.latency)}</span>` : ''}
      ${toolTag}
    </div>
  </div>`;
}

// chanLabel is the detail-pane form: the id is always shown because it is what
// New API's own console and error messages refer to; the name is an addition.
function chanLabel(r){
  return [r.channel_id != null ? '#' + r.channel_id : '', r.channel_name]
    .filter(Boolean).join(' ') || '—';
}

// statusTag renders the success/failure chip.
//
// The HTTP status is only ever populated from the log's [GIN] line, which gin
// writes to a different sink than the file New API logs to — on this deployment
// it never arrives, so every row rendered "?" while the calls themselves were
// fine. So prefer the outcome derived at ingest (from the billing line's
// stream_status), show the HTTP code when one was genuinely observed, and keep
// "?" for the case where the log really does not say.
function statusTag(r){
  const code = r.status != null ? r.status : null;
  const oc = r.outcome || (code == null ? '' : (code < 400 ? 'ok' : 'error'));
  const label = code != null ? code : (oc === 'ok' ? '成功' : oc === 'error' ? '失败' : '?');
  const cls = oc === 'ok' ? 'ok' : oc === 'error' ? 'err' : '';
  const title = [
    oc === 'ok' ? '成功' : oc === 'error' ? '失败' : '日志未记录结束状态',
    r.outcome_reason || '',
    code == null && r.outcome ? '（依据计费记录，非 HTTP 状态码）' : '',
  ].filter(Boolean).join(' · ');
  return `<span class="tag ${cls}" title="${esc(title)}">${esc(String(label))}</span>`;
}

// chanChip renders the channel column: name if resolvable, else the upstream
// address, else the bare id. Empty when the call never reached a channel — a
// request rejected by the distributor has no channel at all.
function chanChip(r){
  const label = r.channel || r.upstream || (r.channel_id != null ? '#' + r.channel_id : '');
  if (!label) return '';
  const title = [
    r.channel_id != null ? '渠道 #' + r.channel_id : '',
    r.channel, r.upstream,
  ].filter(Boolean).join(' · ');
  return `<span class="tag ch" title="${esc(title)}">${esc(label)}</span>`;
}

function params(){
  return new URLSearchParams({
    page, page_size: $('#size').value,
    search: $('#q').value, model: $('#model').value,
    token: $('#tokensel').value,
    tool_name: $('#toolsel').value,
    status: $('#status').value, stream: $('#stream').value,
    tools: $('#tools').checked ? '1' : '', errors: $('#errors').checked ? '1' : '',
    since: toEpoch($('#from').value), until: toEpoch($('#to').value),
  });
}

function fillSel(sel, values, label){
  const cur = sel.value;
  const sig = JSON.stringify(values || []);
  if (sel.dataset.sig === sig) return;
  sel.dataset.sig = sig;
  sel.innerHTML = `<option value="">${label}</option>`;
  (values || []).forEach(v => sel.add(new Option(v, v)));
  if ((values || []).includes(cur)) sel.value = cur;
}

async function load(keepSel){
  let d;
  try {
    const res = await fetch('api/calls?' + params(), {credentials: 'same-origin'});
    if (res.status === 401){ location.reload(); return; }
    d = await res.json();
  } catch(e){
    $('#list').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; return;
  }
  state = d;
  $('#who').textContent = d.user && d.user.username !== '-'
    ? `${d.user.username}（role ${d.user.role}）` : '';
  $('#authnote').textContent = d.auth_mode === 'none' ? '⚠ 未鉴权（内网直连）' : '';
  fillSel($('#model'), d.models, '全部模型');
  // Same rule as the stats page: a response narrowed by this very filter holds
  // only the chosen token, so refilling from it would strand the reader there.
  if (!$('#tokensel').value) fillSel($('#tokensel'), d.tokens || [], '全部令牌');
  fillSel($('#toolsel'), d.tools, '全部工具');
  const pages = Math.max(1, Math.ceil(d.total / d.page_size));
  $('#meta').textContent = `${d.total} 次调用`;
  $('#pinfo').textContent = `${d.page} / ${pages}`;
  $('#prev').disabled = d.page <= 1;
  $('#next').disabled = d.page >= pages;
  $('#list').innerHTML = d.items.length ? d.items.map(item).join('')
    : '<div class="empty">没有匹配的调用记录</div>';
  if (!keepSel) return;
  // Keep the open record on screen across refreshes. The list carries only
  // summaries now, so re-render from the cached full record rather than
  // trying (and failing) to find the bodies in d.items.
  const still = d.items.find(r => r.request_id === selected);
  if (still && detailCache && detailCache.request_id === selected) renderDetail(detailCache);
}

// Single place that paints the right pane, so clamp wiring can never be
// forgotten at one of the call sites.
function renderDetail(rec){
  const pane = $('#detail');
  pane.innerHTML = detail(rec);
  wireClamps(pane);
  // Cards rendered open were measurable just now; mark them so opening and
  // re-closing does not re-measure (and re-hide) their toggles.
  pane.querySelectorAll('.card.open').forEach(c => c.dataset.wired = '1');
}

$('#list').addEventListener('click', async e => {
  const tag = e.target.closest('[data-tools]');
  if (tag){                       // click the ⚒N chip -> filter to calls with tools
    $('#tools').checked = true;
    page = 1; load(true); return;
  }
  const el = e.target.closest('.item'); if (!el) return;
  selected = el.dataset.id;
  document.querySelectorAll('.item.sel').forEach(n => n.classList.remove('sel'));
  el.classList.add('sel');
  // The list only carries summaries - one agent record is ~1MB of bodies, so
  // shipping 30 of them per page made the list unusable. Fetch on demand.
  await showDetail(selected);
});

async function showDetail(rid){
  const pane = $('#detail');
  pane.innerHTML = '<div class="spin">加载中…</div>';
  let rec;
  try {
    const res = await fetch('api/call?id=' + encodeURIComponent(rid), {credentials: 'same-origin'});
    const d = await res.json();
    if (!d.success) throw new Error(d.message || '加载失败');
    rec = d.data;
  } catch(err){
    pane.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    return;
  }
  if (selected !== rid) return;   // a newer click won while this was in flight
  detailCache = rec;
  renderDetail(rec);
  pane.scrollTop = 0;
}

// expand/collapse: cards, individual clamped blocks, and per-section "all"
$('#detail').addEventListener('click', e => {
  // card header toggles the whole card. Clamps inside are measured lazily,
  // the first time the card actually becomes visible - measuring a display:none
  // subtree returns 0 and every toggle would be wrongly hidden.
  const chd = e.target.closest('.chd');
  if (chd && !e.target.closest('[data-all]')){
    const c = document.getElementById(chd.dataset.card);
    c.classList.toggle('open');
    if (c.classList.contains('open') && !c.dataset.wired){
      c.dataset.wired = '1';
      wireClamps(c);
    }
    return;
  }

  const btn = e.target.closest('.exp');
  if (btn){ setExpanded(btn, !btn.classList.contains('open')); return; }

  const all = e.target.closest('.toggle[data-all]');
  if (!all) return;
  const scope = all.closest('.card') || all.closest('section');
  const open = all.textContent.trim() === '展开全部';
  // Opening a section means opening its cards first, otherwise the clamps
  // inside are still hidden and cannot be measured. When the toggle lives in a
  // card's own header (the tool catalogue, the folded transcript) that card is
  // part of the scope too — expanding children of a card that stays closed
  // measures a display:none subtree and shows nothing.
  const cards = [...scope.querySelectorAll('.card')];
  if (scope.classList.contains('card')) cards.unshift(scope);
  cards.forEach(c => {
    c.classList.toggle('open', open);
    if (open && !c.dataset.wired){ c.dataset.wired = '1'; wireClamps(c); }
  });
  [...scope.querySelectorAll('.exp')].filter(b => !b.hidden)
    .forEach(b => setExpanded(b, open));
  all.textContent = open ? '收起全部' : '展开全部';
});

$('#quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#quick button').forEach(n => n.classList.remove('on'));
  b.classList.add('on');
  if (!b.dataset.h){ $('#from').value = ''; $('#to').value = ''; }
  else {
    const now = new Date();
    $('#from').value = localISO(new Date(now.getTime() - parseFloat(b.dataset.h) * 3600e3));
    $('#to').value = '';
  }
  page = 1; load(true);
});

let deb;
$('#q').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(() => { page = 1; load(true); }, 300); });
['#model','#tokensel','#toolsel','#status','#stream','#size','#from','#to'].forEach(s =>
  $(s).addEventListener('change', () => { page = 1; load(true); }));
['#tools','#errors'].forEach(s => $(s).addEventListener('change', () => { page = 1; load(true); }));
$('#prev').onclick = () => { if (page > 1) { page--; load(true); } };
$('#next').onclick = () => { page++; load(true); };
$('#refresh').onclick = () => load(true);
$('#reset').onclick = () => {
  ['#q','#from','#to'].forEach(s => $(s).value = '');
  ['#model','#tokensel','#toolsel','#status','#stream'].forEach(s => $(s).value = '');
  ['#tools','#errors'].forEach(s => $(s).checked = false);
  document.querySelectorAll('#quick button').forEach(n => n.classList.remove('on'));
  document.querySelector('#quick button:last-child').classList.add('on');
  page = 1; load(true);
};
$('#auto').onchange = e => {
  clearInterval(timer);
  if (e.target.checked) timer = setInterval(() => load(true), 5000);
};

// draggable splitter
(function(){
  const d = $('#drag'), l = $('#left');
  let on = false;
  d.addEventListener('mousedown', e => { on = true; d.classList.add('act');
    document.body.style.userSelect = 'none'; e.preventDefault(); });
  window.addEventListener('mousemove', e => {
    if (!on) return;
    l.style.width = Math.max(260, Math.min(e.clientX, window.innerWidth * 0.7)) + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!on) return;
    on = false; d.classList.remove('act'); document.body.style.userSelect = '';
    localStorage.setItem('lv-w', l.style.width);
  });
  const saved = localStorage.getItem('lv-w'); if (saved) l.style.width = saved;
})();

// ===================== stats view =====================
//
// Charts are Chart.js, vendored and served from the binary (see main.go's
// embed) — not a CDN, since the image is scratch on an air-gapped LAN. It
// replaced a hand-written SVG renderer once this page grew a second stacked-bar
// chart and the token dimension: the axis-thinning, tooltips and responsive
// resize that were being reimplemented by hand are what a chart library is for.

let statsData = null, statsBusy = false, statsCharts = [];
// Which metric each breakdown is ranked by. The server sorts models by request
// volume and tokens by spend before folding the tail; these let the reader flip
// to a token-volume ranking, which inverts the order once cache-heavy or
// long-context callers enter the mix — the reason the token dimension exists.
let modelSort = 'requests', tokenSort = 'quota';

// Must match stats.go's tokenUnnamed exactly. It is a label the server sends,
// not a sentinel the client invents, so the two only need to agree on the string
// — but they DO need to agree: this is what tells a filterable row from a gap in
// the measurement.
const TOKEN_UNNAMED = '(未命名)';

const nfmt = n => (n ?? 0).toLocaleString();
// Compact form for the KPI tiles: 7,121,573,591 does not fit in a tile and is
// not read digit-by-digit anyway. The exact value stays in the tooltip/table.
function compact(n){
  n = n || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}
// Dollars come from the same divisor the list view uses, so the two pages can
// never disagree about what a quota unit is worth.
const money = q => '$' + (q / 500000).toFixed(4);

// Milliseconds read as seconds once they pass one: 1234ms is not scanned as a
// duration, 1.2s is. Kept to one decimal at the small end so jitter reads as
// jitter, not as false precision.
const fmtMS = ms => ms == null ? '—'
  : ms >= 60000 ? (ms / 60000).toFixed(1) + 'min'
  : ms >= 1000 ? (ms / 1000).toFixed(1) + 's'
  : Math.round(ms) + 'ms';
const pct = (a, b) => b > 0 ? (100 * a / b).toFixed(1) + '%' : '—';

// Chart palette for the stats view's warm dark surfaces (the --s-* custom
// properties). Hardcoded here rather than read back from getComputedStyle so
// the charts don't depend on the scoped cascade resolving at boot. The
// input/output pair stays blue+amber: it is the colour-blind-safe pair, and
// blue+red would read as ok/fail.
const CT = {
  spend:  '#6ea8fe',
  input:  '#6ea8fe',    // 输入 token
  output: '#fbbf24',    // 输出 token
  ok:  '#6ea8fe', err: '#f87171', unk: '#8a857d',
  grid: 'rgba(255,255,255,.055)', line: '#3a3530', dim2: '#6f6962', fg: '#f6f4f1',
};

// A vertical fade for single-series bars: solid at the data end, translucent
// at the baseline, so the mark reads as rising out of the grid rather than
// sitting on it. Scriptable because the gradient needs the drawn chart area.
function vgrad(hex){
  return c => {
    const a = c.chart.chartArea;
    if (!a) return hex;
    const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
    g.addColorStop(0, hex);
    g.addColorStop(1, hex + '3d');      // ~24% alpha at the baseline
    return g;
  };
}

// destroyCharts releases the previous render's Chart instances. renderStats
// rebuilds the DOM (host.innerHTML), detaching the old canvases; without this
// their resize observers and animation state would leak on every refetch.
function destroyCharts(){ statsCharts.forEach(c => c.destroy()); statsCharts = []; }

// sparkline draws the KPI hero's own series as a small filled area under the
// headline figure — the number shows its shape, not just its size.
function sparkline(canvas, values, color){
  const c = new Chart(canvas, {
    type: 'line',
    data: { labels: values.map((_, i) => i), datasets: [{
      data: values, borderColor: color, borderWidth: 1.5,
      pointRadius: 0, tension: .35, fill: true,
      backgroundColor: ctx => {
        const a = ctx.chart.chartArea;
        if (!a) return 'transparent';
        const g = ctx.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
        g.addColorStop(0, color + '38');
        g.addColorStop(1, color + '00');
        return g;
      },
    }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      events: [],                        // decorative: no hover, no tooltip
      scales: { x: {display: false}, y: {display: false, beginAtZero: true} },
      plugins: { legend: {display: false}, tooltip: {enabled: false} },
      layout: { padding: { top: 4 } },
    },
  });
  statsCharts.push(c);
}

// trendChart draws one time-bucketed stacked bar chart into a canvas.
//
// labels: bucket labels. datasets: {label, data, color, grad}. fmt(v, axis):
// how a value reads — dollars, token counts or plain counts — compact on the
// axis and full in the tooltip. A single-dataset call (spend) just leaves one
// layer, and gets the vertical gradient.
function trendChart(canvas, labels, datasets, fmt){
  const stacked = datasets.length > 1;
  const c = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: datasets.map(d => ({
      label: d.label, data: d.data,
      backgroundColor: d.grad ? vgrad(d.color) : d.color,
      // Square baseline: rounding the bottom detaches a stacked segment from
      // the bar below it, and on a single series floats it off the axis.
      borderRadius: stacked ? 2 : { topLeft: 6, topRight: 6 },
      borderSkipped: stacked ? false : 'bottom',
      maxBarThickness: 34,
    })) },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { stacked: true, grid: { display: false }, border: { color: CT.line },
             ticks: { color: CT.dim2, font: { size: 10 }, maxRotation: 0,
                      autoSkip: true, autoSkipPadding: 14 } },
        y: { stacked: true, beginAtZero: true, grid: { color: CT.grid },
             border: { display: false },
             ticks: { color: CT.dim2, font: { size: 10 }, callback: v => fmt(v, true) } },
      },
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#262320', borderColor: CT.line, borderWidth: 1,
          titleColor: CT.dim2, bodyColor: CT.fg, padding: 10, cornerRadius: 10,
          callbacks: { label: ctx => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } },
      },
    },
  });
  statsCharts.push(c);
}

// lineChart draws rate/latency trends - the cases where a bar implies a volume
// and the series is actually a ratio or a duration. fmt is the same
// axis/tooltip formatter contract as trendChart's.
function lineChart(canvas, labels, datasets, fmt, opts){
  const o = opts || {};
  const c = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: datasets.map(d => ({
      label: d.label, data: d.data, borderColor: d.color,
      backgroundColor: d.color + '22', borderWidth: 1.8,
      pointRadius: 0, pointHitRadius: 8, tension: .3, spanGaps: false,
    })) },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { display: false }, border: { color: CT.line },
             ticks: { color: CT.dim2, font: { size: 10 }, maxRotation: 0,
                      autoSkip: true, autoSkipPadding: 14 } },
        y: { beginAtZero: true, max: o.max, grid: { color: CT.grid },
             border: { display: false },
             ticks: { color: CT.dim2, font: { size: 10 }, callback: v => fmt(v, true) } },
      },
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#262320', borderColor: CT.line, borderWidth: 1,
          titleColor: CT.dim2, bodyColor: CT.fg, padding: 10, cornerRadius: 10,
          callbacks: { label: ctx => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } },
      },
    },
  });
  statsCharts.push(c);
}

// doughnutChart draws one composition ring. Centre text carries the headline
// figure so the ring shows the split and the number survives without a hover.
function doughnutChart(canvas, parts, center){
  const c = new Chart(canvas, {
    type: 'doughnut',
    data: { labels: parts.map(p => p.label), datasets: [{
      data: parts.map(p => p.value),
      backgroundColor: parts.map(p => p.color),
      borderColor: '#1d1b18', borderWidth: 2,
    }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, cutout: '68%',
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#262320', borderColor: CT.line, borderWidth: 1,
          titleColor: CT.dim2, bodyColor: CT.fg, padding: 10, cornerRadius: 10 },
      },
    },
    plugins: [{
      id: 'ctext',
      afterDraw(ch){
        const {ctx, chartArea: a} = ch;
        if (!a) return;
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = CT.fg; ctx.font = '700 17px system-ui';
        ctx.fillText(center, (a.left + a.right) / 2, (a.top + a.bottom) / 2);
        ctx.restore();
      },
    }],
  });
  statsCharts.push(c);
}


// sortRows re-ranks the already-folded breakdown rows by a chosen metric. The
// server folds the long tail into one "other" row before sending, so this
// reorders only the named rows — "other" (and an unnamed-token gap) stay pinned
// to the bottom as the residual, and the rows still sum to the totals.
// `metric` is an accessor rather than a field name because two of the model
// rankings (error rate, average latency) are ratios of two fields each.
function sortRows(rows, metric, tail){
  const k = r => r.model ?? r.token ?? r.name;
  const named = rows.filter(r => !tail.includes(k(r)));
  const rest  = rows.filter(r =>  tail.includes(k(r)));
  named.sort((a, b) => (metric(b) - metric(a)) || (b.requests - a.requests));
  return named.concat(rest);
}

// Per-model averages. Wall-clock latency is preferred where the deployment
// logs it (GIN); otherwise the billing line's first-response time is the only
// latency signal that exists — see the lat_sum_ms field comment in stats.go.
const modelAvgMS = m => m.lat_count ? m.lat_sum_ms / m.lat_count
                    : m.frt_count ? m.frt_sum_ms / m.frt_count : null;
// Failure rate over recorded outcomes only. 63% of this archive predates the
// outcome field; err/requests would read that silence as failure.
const modelErrRate = m => (m.ok + m.err) ? m.err / (m.ok + m.err) : 0;

// modelCard renders the model breakdown, rankable by request volume, token
// volume, failure rate, or average latency. The bar is scaled to whichever
// metric it is sorted by, so the visual order always matches the number
// beside it.
function modelCard(models){
  const rows = sortRows(models, {
    requests: m => m.requests,
    tokens:   m => m.tokens,
    err:      m => modelErrRate(m),
    lat:      m => modelAvgMS(m) ?? -1,   // unmeasured sinks below measured-zero
  }[modelSort] || (m => m.requests), ['other', '(unknown)']);
  const metric = {
    requests: m => m.requests,
    tokens:   m => m.tokens,
    err:      m => modelErrRate(m),
    lat:      m => modelAvgMS(m) ?? 0,
  }[modelSort] || (m => m.requests);
  const max = Math.max(1e-9, ...rows.map(metric));
  const label = {requests: '请求数', tokens: 'Token 量', err: '错误率', lat: '平均延迟'}[modelSort];
  const main = {
    requests: m => nfmt(m.requests),
    tokens:   m => compact(m.tokens),
    err:      m => pct(m.err, m.ok + m.err),
    lat:      m => modelAvgMS(m) == null ? '—' : fmtMS(modelAvgMS(m)),
  }[modelSort];
  const sub = {
    requests: m => money(m.quota),
    tokens:   m => nfmt(m.requests) + ' 次',
    err:      m => `${nfmt(m.err)} 失败 / ${nfmt(m.ok + m.err)} 次已记录`,
    lat:      m => (m.lat_count ? `${nfmt(m.lat_count)} 次计时` :
                    m.frt_count ? `首字 · ${nfmt(m.frt_count)} 次计时` : '无计时数据'),
  }[modelSort];
  return `<div class="card2">
    <div class="hd"><div><h3>模型分布</h3>
      <div class="cap">按${label}排序 · 点击可在列表中筛选</div></div>
      <span class="grow"></span>
      <div class="segp sortsel">
        <button data-msort="requests" class="${modelSort === 'requests' ? 'on' : ''}">请求数</button>
        <button data-msort="tokens" class="${modelSort === 'tokens' ? 'on' : ''}">Token 量</button>
        <button data-msort="err" class="${modelSort === 'err' ? 'on' : ''}">错误率</button>
        <button data-msort="lat" class="${modelSort === 'lat' ? 'on' : ''}">延迟</button>
      </div></div>
    ${rows.length ? rows.map((m, i) => `
      <div class="mrow tkrow" data-model="${esc(m.model)}">
        <span class="rk">${i + 1}</span>
        <div>
          <div class="nm" title="${esc(m.model)}">${esc(m.model)}</div>
          <div class="track"><div class="fill" style="width:${
            Math.max(1, 100 * metric(m) / max)}%"></div></div>
        </div>
        <div class="vv">${main(m)}<br>
          <span class="vs">${sub(m)}</span></div>
      </div>`).join('') : '<div class="cap">此范围内没有调用</div>'}
  </div>`;
}

// tokenCard renders the per-API-token breakdown, rankable by spend or token
// volume — the two invert exactly as they do for models.
function tokenCard(tks, d){
  const byTok = tokenSort === 'tokens';
  const rows = sortRows(tks, byTok ? (t => t.tokens) : (t => t.quota), ['other', TOKEN_UNNAMED]);
  const metric = r => byTok ? r.tokens : r.quota;
  const max = Math.max(1, ...rows.map(metric));
  return `<div class="card2">
    <div class="hd"><div><h3>令牌用量</h3>
      <div class="cap">按${byTok ? 'Token 量' : '花费'}排序 · 点击可在列表中筛选</div></div>
      <span class="grow"></span>
      <div class="segp sortsel">
        <button data-tsort="quota" class="${byTok ? '' : 'on'}">花费</button>
        <button data-tsort="tokens" class="${byTok ? 'on' : ''}">Token 量</button>
      </div>
      <button class="lnk" data-tbl="t-token">表格</button></div>
    ${d.requests > 0 && d.token_name_count === 0 ? `<div class="warnbox">
      索引中暂无令牌名称。运行 <code>logviewer -reindex</code> 可从已归档的记录中回填；
      在此之前所有调用都归入「${esc(TOKEN_UNNAMED)}」。</div>` : ''}
    ${rows.length ? rows.map((t, i) => {
      // An unnamed row is a measurement gap, not a filterable token — the name
      // is exactly what is missing. It carries no spend (name and bill arrive
      // together), so in the spend view it shows its request count rather than a
      // $0.0000 that reads as real.
      const na = t.token === TOKEN_UNNAMED;
      const primary = byTok ? (t.tokens ? compact(t.tokens) : '—')
                            : (na ? '—' : money(t.quota));
      const sub = byTok ? (na ? '' : money(t.quota)) : nfmt(t.requests) + ' 次';
      return `<div class="mrow tkrow ${na ? 'na' : ''}"${
        na ? '' : ` data-token="${esc(t.token)}"`}>
        <span class="rk">${i + 1}</span>
        <div>
          <div class="nm" title="${esc(t.token)}">${esc(t.token)}</div>
          <div class="track"><div class="fill" style="width:${
            Math.max(1, 100 * metric(t) / max)}%"></div></div>
        </div>
        <div class="vv">${primary}<br><span class="vs">${sub}</span></div>
      </div>`;
    }).join('') : '<div class="cap">此范围内没有调用</div>'}
    <div class="tblwrap" id="t-token"></div>
  </div>`;
}

// chanCard renders the upstream-channel breakdown. Rows are NOT clickable:
// the list view has no channel filter, so there is nothing to drill into, and
// a dead affordance is worse than none.
function chanCard(chans){
  const max = Math.max(1, ...chans.map(c => c.requests));
  return `<div class="card2">
    <div class="hd"><div><h3>上游渠道</h3>
      <div class="cap">按请求数排序 · 渠道名实时解析，改名会回溯生效</div></div></div>
    ${chans.length ? chans.map((c, i) => {
      const known = c.ok + c.err;
      return `<div class="mrow tkrow" style="--ka:var(--s-green);cursor:default">
        <span class="rk">${i + 1}</span>
        <div>
          <div class="nm" title="${esc(c.name)}">${esc(c.name)}</div>
          <div class="track"><div class="fill" style="width:${
            Math.max(1, 100 * c.requests / max)}%"></div></div>
        </div>
        <div class="vv">${nfmt(c.requests)} 次<br>
          <span class="vs">${known ? pct(c.err, known) + ' 失败 · ' : ''}${money(c.quota)}</span></div>
      </div>`;
    }).join('') : '<div class="cap">此范围内没有调用</div>'}
  </div>`;
}

// heatmapCard renders the weekday-x-hour activity grid. Colour alpha encodes
// the count relative to the busiest cell, so the scale survives both a quiet
// week and a launch day without a legend per range.
function heatmapCard(dowHours){
  const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const max = Math.max(1, ...dowHours.flat());
  const total = dowHours.flat().reduce((a, b) => a + b, 0);
  const head = [''].concat([...Array(24).keys()].map(h =>
    `<span class="hl">${h % 6 === 0 ? h : ''}</span>`)).join('');
  const rows = dowHours.map((row, d) =>
    `<span class="rl">${days[d]}</span>` + row.map((v, h) => {
      if (!v) return '<span class="cell"></span>';
      const a = 0.15 + 0.85 * v / max;
      return `<span class="cell" data-v="1" title="${days[d]} ${String(h).padStart(2, '0')}:00 · ${
        nfmt(v)} 次" style="background:color-mix(in srgb,var(--s-blue) ${
        Math.round(a * 100)}%,transparent)"></span>`;
    }).join('')).join('');
  return `<div class="card2">
    <div class="hd"><div><h3>活动热力图</h3>
      <div class="cap">星期 × 小时 · 共 ${nfmt(total)} 次 · 悬停查看单格</div></div></div>
    <div class="hmap">${head}${rows}</div>
    <div class="hmaplg">少
      ${[0.15, 0.36, 0.57, 0.78, 1].map(a =>
        `<i style="background:color-mix(in srgb,var(--s-blue) ${Math.round(a * 100)}%,transparent)"></i>`).join('')}
      多</div>
  </div>`;
}


// (The hand-written SVG bar renderer, its tooltip positioner and axis-label
// thinner lived here until Chart.js took over; see the note at the top of this
// section.)

// Small inline SVG icons for the KPI cards (stroke inherits --ka). No icon
// font, no sprite sheet — five paths is smaller than either.
const ICONS = {
  dollar: '<svg viewBox="0 0 24 24"><path d="M12 2v20M17 6.5c0-2-2.2-3.2-5-3.2s-5 1.2-5 3.2 2 2.7 5 3.3 5 1.4 5 3.4-2.2 3.3-5 3.3-5-1.2-5-3.2"/></svg>',
  layers: '<svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  activity: '<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/></svg>',
  bars: '<svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>',
  percent: '<svg viewBox="0 0 24 24"><path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  zap: '<svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
  wrench: '<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2.1-2.1 2.9-2.7z"/></svg>',
  db: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  gauge: '<svg viewBox="0 0 24 24"><path d="M12 15l4-6"/><path d="M3.5 15a9 9 0 1 1 17 0"/></svg>',
};

// o: {cls, ka, icon, spark} — accent colour, icon, and an optional sparkline
// canvas id (drawn by renderStats once the canvas exists).
function kpi(label, value, sub, o){
  o = o || {};
  return `<div class="kpi ${o.cls || ''}" ${o.ka ? `style="--ka:${o.ka}"` : ''}>
    <div class="lb">${o.icon ? `<span class="ic">${ICONS[o.icon]}</span>` : ''}${esc(label)}</div>
    <div class="vl ${value === '—' ? 'dim' : ''}">${esc(String(value))}</div>
    ${sub ? `<div class="sub">${esc(sub)}</div>` : ''}
    ${o.spark ? `<div class="spark"><canvas id="${o.spark}"></canvas></div>` : ''}
  </div>`;
}

function renderStats(d, rng){
  const host = $('#stats');
  const s = d.series || [], models = d.models || [];
  const gran = {hour: '每小时', day: '每天', week: '每周'}[d.granularity] || d.granularity;

  destroyCharts();

  // Success rate is over calls whose outcome the log actually recorded. 63% of
  // this archive predates the outcome field, and ok/total would render that
  // silence as a 37% success rate — a number someone would escalate on.
  const known = d.ok + d.err;
  const rate = known ? (100 * d.ok / known).toFixed(1) + '%' : '—';
  const avg = d.quota_count ? money(d.quota / d.quota_count) : '—';

  // Token-dimension figures. All averaged over token_count, never over requests:
  // the index carries no tokens for records written before the field existed, so
  // dividing by every request would deflate the average as history dilutes it —
  // the rule the KPI subtitles already follow for spend.
  const perCall = d.token_count ? compact(Math.round(d.tokens / d.token_count)) : '—';
  // $/1M tokens = dollars / tokens × 1e6, and dollars = quota / 500000, so this
  // is quota / (0.5 × tokens). Only meaningful when a bill and a usage figure
  // both exist for the window.
  const unit = (d.quota && d.tokens)
    ? '$' + (d.quota / (500000 * d.tokens) * 1e6).toFixed(2) : '—';

  // Cache hit rate: cache reads over total input, over records that reported
  // tokens at all. prompt_tokens already includes the cached share (both
  // OpenAI's accounting and the Anthropic merge in the parser), so the
  // denominator is prompt_tokens as published.
  const hitRate = (d.cached_count && d.prompt_tokens)
    ? pct(d.cached_tokens, d.prompt_tokens) : '—';

  // Daily averages over the resolved window — keeper's DailyAverageCard. Days
  // are calendar days touched, not elapsed 24h periods, matching the bucket
  // axis the reader is looking at.
  const days = rng && rng.since ? Math.max(1, Math.round((rng.until - rng.since + 1) / 86400)) : 0;
  const perDay = v => days ? compact(Math.round(v / days)) : '—';

  // Latency figures. The GIN wall-clock is preferred where it exists; on this
  // deployment it never does (gin logs to another sink), and the billing
  // line's first-response time is the only latency signal — see stats.go.
  const avgLat = d.lat_count ? d.lat_sum_ms / d.lat_count : null;
  const avgFRT = d.frt_count ? d.frt_sum_ms / d.frt_count : null;

  const parts = [];

  if (d.unknown > 0){
    parts.push(`<div class="warnbox">${nfmt(d.unknown)} 次调用（${
      (100 * d.unknown / Math.max(d.requests, 1)).toFixed(0)
      }%）的日志未记录结束状态，未计入成功率。这些记录早于 outcome 字段，
      可用 <code>-reindex</code> 从归档回填。</div>`);
  }
  if (d.token_count === 0 && d.requests > 0){
    parts.push(`<div class="warnbox">索引中暂无 token 数据。运行
      <code>logviewer -reindex</code> 可从已归档的记录中回填。</div>`);
  }
  // The cache/reasoning dimensions ride on the same one-time reindex. Shown
  // only when the window has calls but no coverage, so an old index says why
  // the hero reads "—" instead of rendering an honest-looking 0%.
  if (d.cached_count === 0 && d.requests > 0){
    parts.push(`<div class="warnbox">索引中暂无缓存/推理 token 数据。运行
      <code>logviewer -reindex</code> 可从已归档的记录中回填（全量约 5-10 分钟，
      需停机窗口）；在此之前相关区块显示为「—」。</div>`);
  }

  // Spend and token volume are co-heroes: the whole point of this page is that
  // the two do not track each other (a cache-read token is billed at a fraction
  // of a fresh one), so neither is a subtitle of the other. The cache hit rate
  // joins them as the third hero: on this deployment cache reads dwarf fresh
  // input, and the rate is the one number that says whether the caching is
  // working at all. Each carries a sparkline of its own series.
  parts.push(`<div class="kpis heros">
    ${kpi('总花费', money(d.quota), `${nfmt(d.quota_count)} 次计费`,
      {cls: 'hero', ka: 'var(--s-blue)', icon: 'dollar', spark: 'c-spark-spend'})}
    ${kpi('Token 总量', d.token_count ? compact(d.tokens) : '—',
      d.token_count ? `入 ${compact(d.prompt_tokens)} · 出 ${compact(d.completion_tokens)}`
                    : '索引未记录',
      {cls: 'hero', ka: 'var(--s-violet)', icon: 'layers', spark: 'c-spark-tok'})}
    ${kpi('缓存命中率', hitRate,
      d.cached_count ? `缓存读 ${compact(d.cached_tokens)} / 输入 ${compact(d.prompt_tokens)}`
                     : '索引未记录',
      {cls: 'hero', ka: 'var(--s-green)', icon: 'db', spark: 'c-spark-cache'})}
  </div>`);
  parts.push(`<div class="kpis">
    ${kpi('请求数', nfmt(d.requests), gran + ' · ' + s.length + ' 个区间',
      {ka: 'var(--s-green)', icon: 'activity'})}
    ${kpi('成功率', rate, known ? `${nfmt(d.ok)} 成功 / ${nfmt(d.err)} 失败` : '无可用状态',
      {ka: 'var(--s-green)', icon: 'check'})}
    ${kpi('平均每调用', perCall === '—' ? '—' : perCall + ' tok',
      d.token_count ? `${nfmt(d.token_count)} 次上报` : '索引未记录',
      {ka: 'var(--s-amber)', icon: 'bars'})}
    ${kpi('单位成本', unit, unit === '—' ? '无计费或用量' : '每百万 token',
      {ka: 'var(--s-amber)', icon: 'percent'})}
    ${kpi('平均单价', avg, d.quota_count ? '每次已计费调用' : '无计费记录',
      {ka: 'var(--s-blue)', icon: 'dollar'})}
  </div>`);

  // Performance and shape-of-traffic row. Each tile carries its own coverage
  // count so a "—" is attributable: the number missing is never the number
  // the deployment is too quiet to produce, it is the one the log never wrote.
  parts.push(`<div class="kpis">
    ${kpi('平均延迟', avgLat == null ? '—' : fmtMS(avgLat),
      d.lat_count ? `${nfmt(d.lat_count)} 次计时 · 峰值 ${fmtMS(d.lat_max_ms)}`
                  : '本部署无 GIN 行，见首字延迟',
      {ka: 'var(--s-amber)', icon: 'clock'})}
    ${kpi('平均首字延迟', avgFRT == null ? '—' : fmtMS(avgFRT),
      d.frt_count ? `${nfmt(d.frt_count)} 次计时 · 峰值 ${fmtMS(d.frt_max_ms)}` : '无计费记录',
      {ka: 'var(--s-amber)', icon: 'gauge'})}
    ${kpi('流式占比', pct(d.streamed, d.requests),
      d.requests ? `${nfmt(d.streamed)} 流式 / ${nfmt(d.requests - d.streamed)} 非流式` : '',
      {ka: 'var(--s-blue)', icon: 'zap'})}
    ${kpi('工具调用占比', pct(d.tools, d.requests),
      d.tools ? `平均每次携带 ${(d.tool_defs / d.tools).toFixed(1)} 个工具定义` : '无工具调用',
      {ka: 'var(--s-violet)', icon: 'wrench'})}
    ${kpi('推理 Token', d.reasoning_count ? compact(d.reasoning_tokens) : '—',
      d.reasoning_count ? `占输出 ${pct(d.reasoning_tokens, d.completion_tokens)}` : '索引未记录',
      {ka: 'var(--s-violet)', icon: 'layers'})}
  </div>`);

  // Daily averages — keeper's DailyAverageCard, computed over the resolved
  // window rather than fetched, so they follow the custom range exactly.
  parts.push(`<div class="kpis">
    ${kpi('日均请求', perDay(d.requests), `窗口 ${days || '—'} 天`,
      {ka: 'var(--s-green)', icon: 'activity'})}
    ${kpi('日均 Token', d.token_count ? perDay(d.tokens) : '—', '按已上报记录',
      {ka: 'var(--s-violet)', icon: 'layers'})}
    ${kpi('日均缓存读', d.cached_count ? perDay(d.cached_tokens) : '—', '缓存命中节省的主要来源',
      {ka: 'var(--s-green)', icon: 'db'})}
    ${kpi('日均花费', d.quota_count ? money(Math.round(d.quota / Math.max(days, 1))) : '—',
      `${nfmt(d.quota_count)} 次计费`, {ka: 'var(--s-blue)', icon: 'dollar'})}
  </div>`);

  // Spend trend.
  parts.push(`<div class="card2">
    <div class="hd"><div><h3>花费趋势</h3><div class="cap">${gran} · 单位美元</div></div>
      <span class="grow"></span>
      <button class="lnk" data-tbl="t-spend">表格</button></div>
    <div class="chartbox"><canvas id="c-spend"></canvas></div>
    <div class="tblwrap" id="t-spend"></div>
  </div>`);

  // Token usage trend and request volume share one two-column band. The token
  // chart stacks 缓存读 / 新输入 / 输出 once the cache fields have coverage:
  // prompt_tokens already includes the cached share, so splitting it out is
  // what makes "the cache is doing the work" visible instead of inflating the
  // input bar. Without coverage it falls back to the plain input/output split.
  const hasCache = (d.cached_count || 0) > 0;
  const tokDatasets = hasCache ? [
    {label: '缓存读', data: s.map(b => b.cached_tokens), color: '#34d399'},
    {label: '新输入', data: s.map(b => Math.max(0, b.prompt_tokens - b.cached_tokens)), color: CT.input},
    {label: '输出', data: s.map(b => b.completion_tokens), color: CT.output},
  ] : [
    {label: '输入', data: s.map(b => b.prompt_tokens), color: CT.input},
    {label: '输出', data: s.map(b => b.completion_tokens), color: CT.output},
  ];
  parts.push(`<div class="sgrid">
    <div class="card2">
      <div class="hd"><div><h3>Token 用量趋势</h3>
        <div class="cap">${gran} · ${hasCache ? '缓存读 / 新输入 / 输出' : '输入 / 输出'} 堆叠</div></div>
        <span class="grow"></span>
        <div class="lg">
          ${hasCache ? '<span><i style="background:var(--s-green)"></i>缓存读</span>' : ''}
          <span><i style="background:var(--s-blue)"></i>${hasCache ? '新输入' : '输入'}</span>
          <span><i style="background:var(--s-amber)"></i>输出</span>
        </div>
        <button class="lnk" data-tbl="t-tok">表格</button></div>
      <div class="chartbox"><canvas id="c-tok"></canvas></div>
      <div class="tblwrap" id="t-tok"></div>
    </div>
    <div class="card2">
      <div class="hd"><div><h3>请求量</h3><div class="cap">${gran} · 按结束状态分层</div></div>
        <span class="grow"></span>
        <div class="lg">
          <span><i style="background:var(--s-blue)"></i>成功</span>
          <span><i style="background:var(--s-red)"></i>失败</span>
          <span><i style="background:var(--s-grey)"></i>未记录</span>
        </div>
        <button class="lnk" data-tbl="t-req">表格</button></div>
      <div class="chartbox"><canvas id="c-req"></canvas></div>
      <div class="tblwrap" id="t-req"></div>
    </div>
  </div>`);

  // Rates and durations trend as lines, not bars: a bar implies a volume, and
  // neither a success rate nor a latency is one. Success rate uses the same
  // known-outcome denominator as the KPI; buckets with no recorded outcome are
  // null and break the line rather than plotting a fabricated 0%.
  parts.push(`<div class="sgrid">
    <div class="card2">
      <div class="hd"><div><h3>成功率趋势</h3><div class="cap">${gran} · 仅计已记录状态的调用</div></div>
        <span class="grow"></span>
        <button class="lnk" data-tbl="t-perf">表格</button></div>
      <div class="chartbox"><canvas id="c-ok"></canvas></div>
      <div class="tblwrap" id="t-perf"></div>
    </div>
    <div class="card2">
      <div class="hd"><div><h3>延迟趋势</h3>
        <div class="cap">${gran} · 平均延迟（GIN）与平均首字延迟（计费）</div></div>
        <span class="grow"></span>
        <div class="lg">
          <span><i style="background:var(--s-amber)"></i>平均延迟</span>
          <span><i style="background:var(--s-violet)"></i>平均首字</span>
        </div></div>
      <div class="chartbox"><canvas id="c-lat"></canvas></div>
    </div>
  </div>`);

  // Time-of-day shape and call composition. The hours histogram is the range's
  // own; the doughnuts show the stream/tools mix that their KPI tiles count.
  parts.push(`<div class="sgrid">
    <div class="card2">
      <div class="hd"><div><h3>时段分布</h3><div class="cap">24 小时 · 本时区</div></div></div>
      <div class="chartbox" style="height:170px"><canvas id="c-hours"></canvas></div>
    </div>
    <div class="card2">
      <div class="hd"><div><h3>调用构成</h3><div class="cap">流式与工具调用占比</div></div></div>
      <div class="dnuts">
        <div><div class="dnut"><canvas id="c-dstream"></canvas></div>
          <div class="dlab">流式 ${nfmt(d.streamed)} · 非流式 ${nfmt(d.requests - d.streamed)}</div></div>
        <div><div class="dnut"><canvas id="c-dtools"></canvas></div>
          <div class="dlab">含工具 ${nfmt(d.tools)} · 不含 ${nfmt(d.requests - d.tools)}</div></div>
      </div>
    </div>
  </div>`);

  parts.push(heatmapCard(d.dow_hours || []));

  parts.push(`<div class="sgrid">${modelCard(models)}${tokenCard(d.tokens_by_token || [], d)}</div>`);

  parts.push(chanCard(d.channels || []));

  if (d.unknown_time > 0){
    parts.push(`<div class="note">另有 ${nfmt(d.unknown_time)} 条记录没有可用时间戳，
      无法归入任何区间，已排除。</div>`);
  }
  parts.push(`<div class="note">时间范围 ${fmtRange(rng)} · 时区 ${esc(rng.tz || '')}</div>`);

  host.innerHTML = '<div class="swrap">' + parts.join('') + '</div>';

  // Draw the charts now the canvases exist. Each formatter reads compact on the
  // axis and full in the tooltip.
  const dollars = (v, axis) => axis ? '$' + (v >= 10 ? v.toFixed(0) : v.toFixed(2))
                                    : '$' + v.toFixed(4);
  const toks = (v, axis) => axis ? compact(v) : nfmt(v);
  const count = v => nfmt(v);

  trendChart($('#c-spend'), s.map(b => b.label),
    [{label: '花费', data: s.map(b => b.quota / 500000), color: CT.spend, grad: true}], dollars);
  trendChart($('#c-tok'), s.map(b => b.label), tokDatasets, toks);
  trendChart($('#c-req'), s.map(b => b.label), [
    {label: '成功', data: s.map(b => b.ok), color: CT.ok},
    {label: '失败', data: s.map(b => b.err), color: CT.err},
    {label: '未记录', data: s.map(b => b.unknown), color: CT.unk},
  ], count);

  // Success rate per bucket over recorded outcomes; a bucket with none is a
  // gap in the line, not a 0% someone would escalate on.
  lineChart($('#c-ok'), s.map(b => b.label), [{
    label: '成功率', color: '#34d399',
    data: s.map(b => (b.ok + b.err) ? 100 * b.ok / (b.ok + b.err) : null),
  }], (v, axis) => axis ? v.toFixed(0) + '%' : v.toFixed(1) + '%', {max: 100});

  // Latency trend: the GIN wall-clock where it exists, the billing first-
  // response time as the always-present fallback. Both datasets are drawn and
  // the empty one simply leaves no line.
  lineChart($('#c-lat'), s.map(b => b.label), [
    {label: '平均延迟', color: '#fbbf24',
     data: s.map(b => b.lat_count ? b.lat_sum_ms / b.lat_count : null)},
    {label: '平均首字', color: '#a78bfa',
     data: s.map(b => b.frt_count ? b.frt_sum_ms / b.frt_count : null)},
  ], (v, axis) => axis ? fmtMS(v) : fmtMS(v));

  trendChart($('#c-hours'), [...Array(24).keys()].map(h => h + ':00'),
    [{label: '请求', data: d.hours || [], color: CT.spend, grad: true}], count);

  doughnutChart($('#c-dstream'), [
    {label: '流式', value: d.streamed, color: '#6ea8fe'},
    {label: '非流式', value: d.requests - d.streamed, color: '#3a3530'},
  ], pct(d.streamed, d.requests));
  doughnutChart($('#c-dtools'), [
    {label: '含工具', value: d.tools, color: '#a78bfa'},
    {label: '不含工具', value: d.requests - d.tools, color: '#3a3530'},
  ], pct(d.tools, d.requests));

  // Hero sparklines — one point per bucket, so a single-bucket range draws
  // nothing meaningful and is skipped.
  if (s.length > 1){
    sparkline($('#c-spark-spend'), s.map(b => b.quota / 500000), CT.spend);
    sparkline($('#c-spark-tok'), s.map(b => b.tokens), '#a78bfa');
    sparkline($('#c-spark-cache'),
      s.map(b => b.prompt_tokens ? 100 * b.cached_tokens / b.prompt_tokens : 0), '#34d399');
  }

  // Table twins. Built with textContent (see fillTable), never innerHTML: model
  // and token names come from what a client sent, so they are untrusted.
  fillTable($('#t-spend'), ['时间', '花费', '请求'],
    s.map(b => [b.label, money(b.quota), nfmt(b.requests)]));
  fillTable($('#t-tok'), ['时间', '输入', '输出', '合计'],
    s.map(b => [b.label, nfmt(b.prompt_tokens), nfmt(b.completion_tokens), nfmt(b.tokens)]));
  fillTable($('#t-req'), ['时间', '成功', '失败', '未记录', '合计'],
    s.map(b => [b.label, nfmt(b.ok), nfmt(b.err), nfmt(b.unknown), nfmt(b.requests)]));
  const tks = d.tokens_by_token || [];
  fillTable($('#t-token'), ['令牌', '花费', '请求', '输入', '输出', 'Token'],
    tks.map(t => [t.token, t.token === TOKEN_UNNAMED ? '—' : money(t.quota),
                  nfmt(t.requests), nfmt(t.prompt_tokens), nfmt(t.completion_tokens),
                  t.tokens ? compact(t.tokens) : '—']));
}

function fillTable(host, head, rows){
  host.innerHTML = '';
  const t = document.createElement('table');
  t.className = 'tbl';
  const thead = t.createTHead().insertRow();
  head.forEach(h => { const th = document.createElement('th'); th.textContent = h; thead.appendChild(th); });
  const tb = t.createTBody();
  rows.forEach(r => {
    const tr = tb.insertRow();
    r.forEach(c => { tr.insertCell().textContent = c; });
  });
  host.appendChild(t);
}

function fmtRange(rng){
  if (!rng || !rng.since) return '—';
  const f = e => {
    const d = new Date(e * 1000);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  return f(rng.since) + ' → ' + f(rng.until);
}

function statsParams(){
  const btn = document.querySelector('#srange button.on');
  const r = btn ? btn.dataset.r : '7d';
  const p = new URLSearchParams({range: r, model: $('#smodel').value,
                                 token: $('#stoken').value, stream: $('#sstream').value});
  if (r === 'custom'){
    const a = toEpoch($('#sfrom').value), b = toEpoch($('#sto').value);
    if (a) p.set('since', a);
    if (b) p.set('until', b);
  }
  return p;
}

async function loadStats(){
  if (statsBusy) return;
  statsBusy = true;
  const host = $('#stats');
  // Hold the previous render at reduced opacity rather than flashing a
  // skeleton: no layout jump, and the numbers stay readable while they refresh.
  if (statsData) host.classList.add('busy');
  else host.innerHTML = '<div class="spin">加载中…</div>';
  try {
    const res = await fetch('api/stats?' + statsParams(), {credentials: 'same-origin'});
    if (res.status === 401){ location.reload(); return; }
    const d = await res.json();
    if (!d.success) throw new Error(d.message || '加载失败');
    statsData = d;
    renderStats(d.data, d.range);
    fillSel($('#smodel'),
      (d.data.models || []).map(m => m.model).filter(m => m !== 'other'), '全部模型');
    // Only refill the token options from an UNFILTERED response. A filtered one
    // contains exactly the token that was filtered on, so refilling from it
    // would delete every other option and strand the reader on that token with
    // no way back but a reset.
    if (!$('#stoken').value){
      fillSel($('#stoken'),
        (d.data.tokens_by_token || []).map(t => t.token)
          .filter(t => t !== 'other' && t !== TOKEN_UNNAMED), '全部令牌');
    }
  } catch(e){
    host.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  } finally {
    host.classList.remove('busy');
    statsBusy = false;
  }
}

function setView(v){
  document.body.classList.toggle('view-stats', v === 'stats');
  $('#listfilters').style.display = v === 'stats' ? 'none' : '';
  $('#statsfilters').style.display = v === 'stats' ? '' : 'none';
  document.querySelectorAll('#view button').forEach(b =>
    b.classList.toggle('on', b.dataset.v === v));
  localStorage.setItem('lv-view', v);
  if (v === 'stats' && !statsData) loadStats();
}

$('#view').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setView(b.dataset.v);
});

$('#srange').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#srange button').forEach(n => n.classList.remove('on'));
  b.classList.add('on');
  const custom = b.dataset.r === 'custom';
  ['#sfrom', '#sarrow', '#sto'].forEach(s => $(s).style.display = custom ? '' : 'none');
  if (custom && statsData && statsData.range){
    // Seed the custom inputs from the window just shown, so switching to it is
    // a refinement rather than a blank slate.
    if (!$('#sfrom').value) $('#sfrom').value = localISO(new Date(statsData.range.since * 1000));
    if (!$('#sto').value) $('#sto').value = localISO(new Date(statsData.range.until * 1000));
  }
  loadStats();
});

['#sfrom', '#sto', '#smodel', '#stoken', '#sstream'].forEach(s =>
  $(s).addEventListener('change', () => loadStats()));

$('#stats').addEventListener('click', e => {
  const tb = e.target.closest('[data-tbl]');
  if (tb){
    const w = document.getElementById(tb.dataset.tbl);
    w.classList.toggle('on');
    tb.textContent = w.classList.contains('on') ? '收起表格' : '表格';
    return;
  }
  // Breakdown sort toggle. Re-render from the cached response — the reorder is
  // display-only (see sortRows), so there is nothing to refetch.
  const so = e.target.closest('[data-msort],[data-tsort]');
  if (so){
    if (so.dataset.msort) modelSort = so.dataset.msort;
    else tokenSort = so.dataset.tsort;
    if (statsData) renderStats(statsData.data, statsData.range);
    return;
  }
  // Drill-down: a model or token row hands its slice to the list view, which
  // already does per-call inspection well. The stats page does not duplicate it.
  const row = e.target.closest('[data-model],[data-token]');
  if (!row) return;
  const m = row.dataset.model, tk = row.dataset.token;
  if (m === 'other' || m === '(unknown)' || tk === 'other') return;
  const rng = statsData && statsData.range;
  if (rng){
    $('#from').value = localISO(new Date(rng.since * 1000));
    $('#to').value = localISO(new Date(rng.until * 1000));
    document.querySelectorAll('#quick button').forEach(n => n.classList.remove('on'));
  }
  // Carry the whole filter across, not just the clicked dimension. The row's
  // numbers were computed under the stats page's model filter too, so landing
  // on a list that ignored it would show more calls than the row claimed.
  const setSel = (sel, v) => {
    $(sel).value = v || '';
    if (v && $(sel).value !== v){       // value absent from the list's options
      $(sel).add(new Option(v, v));
      $(sel).value = v;
    }
  };
  setSel('#model', tk ? $('#smodel').value : m);
  setSel('#tokensel', tk || $('#stoken').value);
  setView('list');
  page = 1; load(true);
});

// Chart.js resizes each canvas to its container on its own (responsive +
// maintainAspectRatio:false over a fixed-height .chartbox), so window resize
// needs no manual redraw — the reason the old SVG viewBox handler is gone.

load();
if (localStorage.getItem('lv-view') === 'stats') setView('stats');
</script></body></html>
