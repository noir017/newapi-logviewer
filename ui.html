<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New API 调用日志</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1c2029; --line:#262b36;
  --fg:#e6e8eb; --dim:#9aa4b2; --dim2:#5c6675;
  --acc:#5b9dff; --ok:#3fb950; --err:#f85149; --warn:#d29922;
  --sys:#a371f7; --usr:#3fb950; --asst:#5b9dff; --tool:#d29922;
  --hdr:96px;

  /* Chart-only colour slots.
     Scoped to the stats view rather than reusing --ok/--err, which measure a
     CVD separation of ΔE 2.2 (deutan) against this panel colour — indistinguishable
     to a red-green colourblind reader. That is tolerable in the list, where every
     status chip carries a word beside the colour, but a stacked bar has nothing
     but hue. These two measure ΔE 19.2 and pass every check of the palette
     validator against #171a21. Changing them means re-running it. */
  --c-1:#3987e5;      /* the single series: spend, model volume, success */
  --c-err:#e66767;    /* failures */
  --c-unk:#6e7681;    /* outcome the log never recorded — grey, not a hue: it is
                         the absence of a measurement, not a third category */
  --grid:#232833;     /* hairline, one step off the surface */
}
html,body{height:100%}
body{margin:0;font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--fg);overflow:hidden}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:var(--acc);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b313d;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#39414f}
::-webkit-scrollbar-track{background:transparent}

header{height:var(--hdr);background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.who{color:var(--dim2);font-size:12px;white-space:nowrap}
.grow{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input,select,button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 9px;font-size:12.5px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input[type=search]{min-width:200px}
input[type=datetime-local]{color-scheme:dark;font-size:12px;padding:4px 7px}
button{cursor:pointer}button:hover{border-color:var(--acc);color:var(--acc)}
button.on{border-color:var(--acc);color:var(--acc);background:#15203a}
label.ck{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12.5px;cursor:pointer;user-select:none}
label.ck input{width:13px;height:13px;accent-color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;border-right:1px solid var(--line);padding:5px 9px}
.seg button:last-child{border-right:none}
.sep{width:1px;height:18px;background:var(--line);margin:0 2px}

/* ---- split layout ---- */
.split{display:flex;height:calc(100vh - var(--hdr));overflow:hidden}
.left{width:400px;min-width:260px;max-width:70vw;border-right:1px solid var(--line);
  display:flex;flex-direction:column;background:var(--bg)}
.drag{width:5px;cursor:col-resize;background:transparent;flex:none;position:relative}
.drag:hover::after,.drag.act::after{content:"";position:absolute;inset:0 2px;background:var(--acc)}
.right{flex:1;overflow-y:auto;padding:16px 20px 40px;min-width:0}

.lmeta{padding:7px 12px;color:var(--dim2);font-size:11.5px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex:none}
.list{flex:1;overflow-y:auto}
.pager{flex:none;display:flex;gap:6px;align-items:center;justify-content:center;
  padding:8px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
.pager button{padding:4px 10px;font-size:12px}
.pager button:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--dim2)}

.item{padding:9px 12px;border-bottom:1px solid #1e222b;cursor:pointer}
.item:hover{background:var(--panel)}
.item.sel{background:#15203a;border-left:3px solid var(--acc);padding-left:9px}
.i1{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.i1 .t{color:var(--dim);font-size:11.5px;flex:none}
.i1 .m{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.i2{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.i3{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;padding:1px 6px;border-radius:20px;border:1px solid var(--line);
  color:var(--dim2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#1c3a24}
.tag.err{color:var(--err);border-color:#4a1f1f}
.tag.st{color:var(--acc);border-color:#1e3559}
.tag.tl{color:var(--tool);border-color:#4a3a12;cursor:pointer}
.tag.tl:hover{background:#2a2110}
/* channel chip: names run long ("nvidia-nim-3682 (2177271479@qq.com)"), and a
   wrapped row is harder to scan than a clipped one. Full text is in the title. */
.tag.ch{color:#93a4c8;border-color:#2c3654;max-width:190px;overflow:hidden;
  text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.tag.cl{color:var(--tool);border-color:#4a3a12;background:#241d0e;cursor:pointer}

/* ---- stats view ---- */
/* Its own scroll container. body is overflow:hidden and .split is sized from
   --hdr, so a stats pane that grew the document would be unscrollable — content
   below the fold simply unreachable. */
.stats{height:calc(100vh - var(--hdr));overflow-y:auto;display:none;
  background:
    radial-gradient(1100px 460px at 12% -10%, rgba(91,157,255,.10), transparent 58%),
    radial-gradient(820px 420px at 100% 0%, rgba(163,113,247,.07), transparent 52%),
    var(--bg)}
body.view-stats .stats{display:block}
body.view-stats .split{display:none}
/* Refetch holds the previous render rather than flashing a skeleton. */
.stats.busy{opacity:.55;transition:opacity .12s}

/* Keeper-derived design layer, scoped to the stats view so the list/detail
   pages keep their own palette: warm dark surfaces, wide radii, pill controls,
   and a centred measure instead of the list's edge-to-edge density. */
.swrap{max-width:1220px;margin:0 auto;padding:22px 20px 56px}
.stats, #statsfilters{
  --s-card:#1d1b18; --s-card2:#262320; --s-line:#3a3530; --s-line2:#4a453f;
  --s-text:#f6f4f1; --s-dim:#c9c3bb; --s-mute:#9c958d; --s-faint:#6f6962;
  --s-blue:#6ea8fe; --s-violet:#a78bfa; --s-amber:#fbbf24;
  --s-green:#34d399; --s-red:#f87171; --s-grey:#8a857d;
  --s-r:20px;
}
.stats{color:var(--s-text)}

/* Pill segmented control (keeper's connected tab bar): a rounded shell holding
   capsule buttons, the active one raised on a lighter surface. */
.segp{display:inline-flex;align-items:center;gap:2px;padding:3px;
  border:1px solid var(--s-line);border-radius:999px;
  background:var(--s-card);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.segp button{border:none;border-radius:999px;background:transparent;
  color:var(--s-mute);font-size:11.5px;font-weight:600;padding:4px 12px;
  cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.segp button:hover{color:var(--s-text);background:rgba(255,255,255,.05)}
.segp button.on{background:var(--s-card2);color:var(--s-text);
  box-shadow:0 2px 8px rgba(0,0,0,.35)}

/* The stats filter row reuses the header's one-line budget (--hdr is fixed),
   so the pills here stay at the header's control height, not the page's. */
#statsfilters .seg{border:none;background:none;padding:0}
#statsfilters select{background:var(--s-card);border-color:var(--s-line);
  border-radius:999px;padding:5px 12px;color:var(--s-dim)}
#statsfilters select:focus{border-color:var(--s-blue)}
#statsfilters input[type=datetime-local]{background:var(--s-card);
  border-color:var(--s-line);border-radius:999px;padding:4px 10px;color:var(--s-dim)}
#srangelabel{color:var(--s-faint)}

/* KPI cards: keeper's stat card — accent strip bleeding in from the top-left
   corner, a radial glow of the same hue, wide radius, and a hover lift. The
   accent hue is per-card via --acc-* custom properties. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:12px;margin-bottom:14px}
/* The co-hero pair gets its own wider band above the secondary grid. */
.kpis.heros{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpi{position:relative;overflow:hidden;background:var(--s-card);
  border:1px solid var(--s-line);border-radius:var(--s-r);
  padding:14px 16px 13px;display:flex;flex-direction:column;gap:2px;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--ka,var(--s-blue)) 18%,
    color-mix(in srgb,var(--ka,var(--s-blue)) 55%,transparent) 55%,transparent 88%)}
.kpi::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 120% at 10% 0%,
    color-mix(in srgb,var(--ka,var(--s-blue)) 13%,transparent),transparent 60%)}
.kpi:hover{transform:translateY(-2px);border-color:var(--s-line2);
  box-shadow:0 12px 30px rgba(0,0,0,.35)}
.kpi>*{position:relative}
.kpi .lb{color:var(--s-mute);font-size:11.5px;font-weight:600;letter-spacing:.02em;
  display:flex;align-items:center;gap:7px;margin-bottom:6px}
.kpi .ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  flex:none;color:var(--ka,var(--s-blue));
  background:color-mix(in srgb,var(--ka,var(--s-blue)) 14%,var(--s-card));
  border:1px solid color-mix(in srgb,var(--ka,var(--s-blue)) 30%,transparent)}
.kpi .ic svg{width:13px;height:13px;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Proportional figures, not tabular: tabular-nums gives every digit the width of
   a zero, which reads loose at display sizes. Tabular is for the table below. */
.kpi .vl{font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.3px;
  color:var(--s-text)}
.kpi .sub{color:var(--s-faint);font-size:11px;margin-top:3px}
.kpi.hero .vl{font-size:30px;font-weight:800}
.kpi .vl.dim{color:var(--s-faint);font-weight:500}
/* The hero pair carries a sparkline of its own series, so the headline number
   shows its shape, not just its size. */
.kpi .spark{margin:8px -4px -4px;height:40px;position:relative}

/* Section cards. */
.card2{background:var(--s-card);border:1px solid var(--s-line);
  border-radius:var(--s-r);padding:16px 18px 16px;margin-bottom:14px}
.card2 h3{font-size:13.5px;margin:0 0 2px;font-weight:700;color:var(--s-text)}
.card2 .cap{color:var(--s-faint);font-size:11.5px;margin-bottom:12px}
.card2 .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card2 .hd .grow{flex:1}
.lg{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--s-mute)}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
/* Chart.js draws into a canvas that needs an explicitly sized, positioned parent;
   it fills the box and resizes with the window from there. */
.chartbox{position:relative;height:220px;width:100%}
/* Sort toggle on the breakdown cards reuses the pill segmented control. */
.sortsel button{font-size:11px;padding:3px 11px}
/* Two-column band for paired cards (token trend + request volume, model +
   token breakdowns): same information, half the scroll. */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
  margin-bottom:14px}
.sgrid .card2{margin-bottom:0}
@media(max-width:980px){.sgrid{grid-template-columns:1fr}}

/* Activity heatmap (weekday x hour). Plain HTML cells, not a canvas: 168
   nodes is cheap, and a real element per cell gives hover and tooltips
   without reimplementing hit-testing. Colour alpha carries the value, like
   keeper's ActivityHeatmapGrid. */
.hmap{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:3px;
  align-items:center;margin-top:4px}
.hmap .hl{color:var(--s-faint);font-size:10px;text-align:center;
  font-variant-numeric:tabular-nums}
.hmap .rl{color:var(--s-mute);font-size:10.5px;text-align:right;padding-right:2px}
.hmap .cell{height:16px;border-radius:4px;background:rgba(255,255,255,.045)}
.hmap .cell[data-v]:hover{outline:1px solid var(--s-line2)}
.hmaplg{display:flex;align-items:center;gap:4px;color:var(--s-faint);
  font-size:10.5px;justify-content:flex-end;margin-top:8px}
.hmaplg i{width:13px;height:10px;border-radius:3px;display:inline-block}

/* Composition doughnuts: two small rings side by side, each with its total in
   the middle via the legend below the canvas. */
.dnuts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dnut{position:relative;height:168px}
.dnut .dlab{text-align:center;color:var(--s-mute);font-size:11.5px;margin-top:8px}
@media(max-width:640px){.dnuts{grid-template-columns:1fr}}

/* Distribution rows: rank numeral, name, a gradient bar with a rounded end,
   and a right-aligned figure. Rows stay HTML (not SVG) because names run long
   and ellipsis handles that far better than tspan arithmetic. */
.mrow{display:grid;grid-template-columns:22px 1fr 86px;gap:10px;align-items:center;
  padding:6px 8px;margin:0 -8px;cursor:pointer;border-radius:10px}
.mrow:hover{background:var(--s-card2)}
.mrow .rk{color:var(--s-faint);font-size:10.5px;font-weight:700;text-align:center;
  font-variant-numeric:tabular-nums}
.mrow .nm{font-size:12.5px;color:var(--s-text);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.mrow .track{height:6px;background:rgba(255,255,255,.06);border-radius:99px;
  overflow:hidden;margin-top:5px}
.mrow .fill{height:100%;border-radius:99px;
  background:linear-gradient(90deg,
    color-mix(in srgb,var(--ka,var(--s-blue)) 62%,transparent),var(--ka,var(--s-blue)))}
.mrow .vv{text-align:right;font-size:12px;color:var(--s-dim);line-height:1.35;
  font-variant-numeric:tabular-nums}
.mrow .vv .vs{color:var(--s-faint);font-size:10.5px}

/* Token rows reuse .mrow's geometry with a wider value column: the figure there
   is money ("$12.3456"), not a request count, and it must not wrap under its own
   bar. The bar encodes spend, so its scale is the row's quota, not its volume.

   NOT named .tk — that class is already the JSON syntax highlighter's token-KEY
   colour (green, see .tk/.tv/.tn below), and a token row wearing it inherited
   green names from a rule about pretty-printed JSON. Two different meanings of
   "token" in one stylesheet; this one spells out which. */
.mrow.tkrow{grid-template-columns:22px 1fr 112px}
.mrow{--ka:var(--s-violet)}
.mrow.tkrow{--ka:var(--s-amber)}
/* The unnamed row is a measurement gap, not a token. Grey it the same way the
   charts grey an unrecorded outcome, and drop the affordance: there is nothing
   to filter by, since the name is exactly what is missing. */
.mrow.na{cursor:default}
.mrow.na .nm{color:var(--s-faint)}
.mrow.na .fill{background:var(--s-grey)}
.mrow.na:hover{background:none}

/* The table twin. Every value a tooltip shows is reachable here without
   hovering, which is what keeps the charts from gating their own data. */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:6px 10px;white-space:nowrap;
  border-bottom:1px solid color-mix(in srgb,var(--s-line) 55%,transparent)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--s-mute);font-weight:600;position:sticky;top:0;
  background:var(--s-card2)}
.tbl td{color:var(--s-dim)}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--s-card2)}
.tblwrap{max-height:280px;overflow:auto;margin-top:10px;display:none;
  border:1px solid var(--s-line);border-radius:12px}
.tblwrap.on{display:block}
.lnk{background:transparent;border:1px solid var(--s-line);border-radius:999px;
  color:var(--s-mute);font-size:11px;font-weight:600;padding:3px 11px;cursor:pointer;
  transition:color .15s,border-color .15s}
.lnk:hover{color:var(--s-text);border-color:var(--s-line2)}

.note{color:var(--s-faint);font-size:11.5px;margin:2px 0 12px}
.stats .warnbox{background:rgba(210,153,34,.10);border:1px solid rgba(210,153,34,.35);
  color:#e3b341;border-radius:12px;padding:9px 13px;font-size:11.5px;margin-bottom:12px}
.stats .warnbox code{color:#f0c36a}
.warnbox{background:#1d1a0e;border:1px solid #4a3a12;color:#e3b341;border-radius:8px;
  padding:8px 11px;font-size:11.5px;margin-bottom:12px}

/* ---- detail ---- */
.ph{color:var(--dim2);text-align:center;padding:80px 20px;font-size:13px}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dh h2{font-size:15px;margin:0;font-weight:600}
.rid{color:var(--dim2);font-size:11.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px 14px;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.kv div{font-size:12px;min-width:0}
.kv b{display:block;color:var(--dim2);font-weight:500;font-size:10.5px;margin-bottom:1px}
.kv span{word-break:break-all}

section{margin-bottom:14px}
.st{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.st h3{font-size:11.5px;margin:0;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.st .n{color:var(--dim2);font-size:11px}

.msg{border:1px solid var(--line);border-left-width:3px;border-radius:0 7px 7px 0;
  padding:8px 11px;margin-bottom:6px;background:#12151b}
.msg.system{border-left-color:var(--sys)}
.msg.user{border-left-color:var(--usr)}
.msg.assistant{border-left-color:var(--asst)}
.msg.tool{border-left-color:var(--tool)}
.role{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim2);margin-bottom:3px;font-weight:600}
.msg .txt{white-space:pre-wrap;word-break:break-word;font-size:13px}

pre.j{background:#0d1017;border:1px solid var(--line);border-radius:7px;padding:10px 12px;
  overflow-x:auto;font-size:12px;margin:0;max-height:400px;overflow-y:auto}
.tk{color:#7ee787}.tv{color:#a5d6ff}.tn{color:#79c0ff}.tb{color:#ffa657}.tnull{color:var(--dim2)}

.tool-def{background:#12151b;border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:6px}
.tool-def.used{border-color:#4a3a12;background:#171308}
.tool-def .nm{color:var(--tool);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.tool-def .ds{color:var(--dim);font-size:12px;margin:2px 0 5px}
.params{font-size:12px;color:var(--dim)}
.params .p{padding:1px 0}
.params .pn{color:var(--fg)}
.params .pt{color:var(--acc);font-size:11px}
.params .rq{color:var(--err);font-size:10px}
.used-badge{font-size:10px;background:#3a2d0c;color:#e3b341;padding:1px 6px;border-radius:20px;font-weight:500}

.tc{background:#1a1710;border:1px solid #4a3a12;border-radius:7px;padding:9px 11px;margin-bottom:6px}
.tc .nm{color:var(--tool);font-weight:600;font-size:13px}
.reason{background:#141019;border:1px solid #2e2440;border-radius:7px;padding:9px 11px;
  color:#c9b8e8;font-size:12.5px;white-space:pre-wrap;max-height:240px;overflow-y:auto}
.usage{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.usage div{padding:8px 14px;border-right:1px solid var(--line);background:var(--panel2);min-width:84px}
.usage div:last-child{border-right:none}
.usage b{display:block;font-size:10px;color:var(--dim2);font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.usage span{font-size:15px;font-weight:600}
.usage .hl span{color:var(--warn)}
/* ---- top-level cards ----
   An agent transcript is one call carrying 130+ messages. Flat rendering is
   unreadable, so the conversation is grouped into per-turn cards and the tool
   catalogue into one collapsible card, both collapsible as a unit. */
.card{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;
  background:var(--panel);overflow:hidden}
.card>.chd{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;
  user-select:none;background:var(--panel2);border-bottom:1px solid transparent}
.card>.chd:hover{background:#20252f}
.card.open>.chd{border-bottom-color:var(--line)}
.card>.chd .ar{font-size:9px;color:var(--dim2);transition:transform .12s;flex:none}
.card.open>.chd .ar{transform:rotate(90deg)}
.card>.chd .ct{font-weight:600;font-size:12.5px;white-space:nowrap}
.card>.chd .cs{color:var(--dim2);font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.card>.cbd{padding:10px 11px;display:none}
.card.open>.cbd{display:block}
/* turn cards nest one level in; tint the rail by what the turn did */
.card.turn>.chd{background:#161a22}
.card.turn{border-color:#222732}
.turn .idx{color:var(--dim2);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.turn .tt{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.turn .tt .tag{cursor:default}
.card.sysmsg{border-left:3px solid var(--sys)}
.card.usermsg{border-left:3px solid var(--usr)}
.card.turn{border-left:3px solid var(--asst)}
/* the folded transcript: everything but the newest exchange lives in here, so
   opening a record does not mean scrolling past 300 cards to reach the reply */
.card.hist>.chd{background:#1a1520}
.card.hist{border-color:#2a2233}
.card.hist>.cbd{padding:8px 9px;background:#0f1116}
.tailhd{color:var(--dim2);font-size:11px;margin:10px 0 5px;letter-spacing:.3px}
.cardgroup{margin-bottom:6px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.exp-all{margin-left:auto;flex:none}

.empty{text-align:center;color:var(--dim2);padding:40px 20px;font-size:12.5px}
.warnbox{background:#2a1f10;border:1px solid #4a3a12;color:#e3b341;padding:8px 11px;
  border-radius:7px;font-size:12px;margin-bottom:12px}
.spin{color:var(--dim2);text-align:center;padding:30px;font-size:12.5px}

/* ---- collapsible blocks ----
   Long prompts and tool schemas dominate the pane, so anything past ~4 lines
   is clamped. Only blocks that actually overflow get a toggle: measured in JS
   after render, because the height depends on wrapping. */
.clamp{position:relative;overflow:hidden}
.clamp.on{max-height:var(--clh,84px)}
/* fade the cut edge so it reads as truncated rather than as the end */
.clamp.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;
  background:linear-gradient(to bottom,transparent,var(--fadeto,#12151b));pointer-events:none}
.exp{display:flex;align-items:center;gap:7px;margin-top:5px;cursor:pointer;
  color:var(--dim2);font-size:11.5px;user-select:none;padding:2px 0}
.exp:hover{color:var(--acc)}
.exp .ar{font-size:9px;transition:transform .12s}
.exp.open .ar{transform:rotate(90deg)}
.exp .meta{color:var(--dim2)}
.exp:hover .meta{color:var(--dim)}
/* section-level toggle sits in the header row, right-aligned */
.st .grow{flex:1}
.st .toggle{cursor:pointer;color:var(--dim2);font-size:11px;user-select:none;
  border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.st .toggle:hover{color:var(--acc);border-color:var(--acc)}
@media(max-width:860px){
  .split{flex-direction:column;height:auto;overflow:visible}
  body{overflow:auto}
  .left{width:auto!important;max-width:none;border-right:none;border-bottom:1px solid var(--line);height:46vh}
  .drag{display:none}
}
</style></head><body>
